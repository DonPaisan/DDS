[build]
  publish = "site"
  functions = "netlify/functions"
  # Only redeploy when the site or functions change. Agent reports, prompts,
  # and docs can be committed without triggering a deploy.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- site/ netlify/ netlify.toml package.json"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/funnel.html"
  [headers.values]
    X-Robots-Tag = "noindex"
    Cache-Control = "no-store"
