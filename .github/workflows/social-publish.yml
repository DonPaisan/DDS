name: Social publish

# Feed: morning carousel (am, 9:00 AM ET) and evening one-pager or Reel (pm, 6:00 PM ET).
# Stories: the noon slot (12:00 PM ET) for quotes and did-you-knows as Stories.
# Posts whatever is queued for today in that slot (plus anything overdue) to the
# Facebook Page and the linked Instagram account. Run by hand from the Actions tab
# to post right now; pick the slot or leave it on "auto".
# Requires the META_TOKEN secret (pages_manage_posts, pages_read_engagement,
# instagram_basic, instagram_content_publish) and social.enabled: true.
on:
  schedule:
    - cron: "0 12-23 * * *"   # hourly 8 AM-7 PM ET; GitHub runs these hours late, so a slot's first run posts and later runs are no-ops
  workflow_dispatch:
    inputs:
      slot:
        description: "Which slot to post (auto = by time of day)"
        type: choice
        options: [auto, am, noon, pm]
        default: auto

permissions:
  contents: write

concurrency: social-publish

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agent/requirements.txt
      - run: pip install -r agent/requirements.txt
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Chromium for slide rendering
        run: npm i --no-save playwright@1 && npx playwright install --with-deps chromium

      - name: Random delay of 0-50 minutes so posts land at uneven times
        if: github.event_name == 'schedule'
        run: sleep $((RANDOM % 3000))
      - name: Pick slot
        id: slot
        run: |
          s="${{ github.event.inputs.slot }}"
          if [ -z "$s" ] || [ "$s" = "auto" ]; then
            h=$(date -u +%H)
            if [ "$h" -lt 15 ]; then s=am; elif [ "$h" -lt 19 ]; then s=noon; else s=pm; fi
          fi
          echo "slot=$s" >> "$GITHUB_OUTPUT"
          echo "Posting slot: $s"

      - name: Fetch photos for one-pagers that still need one
        working-directory: agent
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python src/social/render_queue.py --photos-only || true

      - name: Publish due posts
        working-directory: agent
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python src/social/publish.py --really --slot "${{ steps.slot.outputs.slot }}"

      - name: Record what was posted
        run: |
          git config user.name "dds-social-bot"
          git config user.email "noreply@debtdirectsolutions.com"
          git add agent/social/queue site/social
          git diff --cached --quiet || git commit -m "social: mark posts published $(date -u +%F) ${{ steps.slot.outputs.slot }}"
          git push
