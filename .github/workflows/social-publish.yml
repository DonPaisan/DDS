name: Social publish

# Two carousels a day: the "am" slot at 9:00 AM ET and the "pm" slot at 6:00 PM ET.
# Posts whatever is queued for today in that slot (plus anything overdue) to the
# Facebook Page and the linked Instagram account. Run by hand from the Actions tab
# to post right now; pick the slot or leave it on "auto".
# Requires the META_TOKEN secret (pages_manage_posts, pages_read_engagement,
# instagram_basic, instagram_content_publish) and social.enabled: true.
on:
  schedule:
    - cron: "0 13 * * *"   # 13:00 UTC = 9:00 AM ET  → am
    - cron: "0 22 * * *"   # 22:00 UTC = 6:00 PM ET  → pm
  workflow_dispatch:
    inputs:
      slot:
        description: "Which slot to post (auto = by time of day)"
        type: choice
        options: [auto, am, pm]
        default: auto

permissions:
  contents: write

concurrency: social-publish

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agent/requirements.txt
      - run: pip install -r agent/requirements.txt

      - name: Pick slot
        id: slot
        run: |
          s="${{ github.event.inputs.slot }}"
          if [ -z "$s" ] || [ "$s" = "auto" ]; then
            if [ "$(date -u +%H)" -lt 18 ]; then s=am; else s=pm; fi
          fi
          echo "slot=$s" >> "$GITHUB_OUTPUT"
          echo "Posting slot: $s"

      - name: Publish due posts
        working-directory: agent
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python src/social/publish.py --really --slot "${{ steps.slot.outputs.slot }}"

      - name: Record what was posted
        run: |
          git config user.name "dds-social-bot"
          git config user.email "noreply@debtdirectsolutions.com"
          git add agent/social/queue
          git diff --cached --quiet || git commit -m "social: mark posts published $(date -u +%F) ${{ steps.slot.outputs.slot }}"
          git push
