name: Social content (weekly)

# Generates next week's Instagram/Facebook posts with Claude, renders the quote
# cards into site/social/, and opens a PR so you approve them before anything
# is published. publish.py only runs when you merge AND set social.enabled: true.
on:
  schedule:
    - cron: "0 13 * * 5"   # Fridays 13:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    if: ${{ vars.SOCIAL_CONTENT_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: agent/requirements.txt }
      - run: pip install -r agent/requirements.txt
      - name: Generate posts
        working-directory: agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python src/social/generate.py
      - name: Open PR for review
        uses: peter-evans/create-pull-request@v6
        with:
          branch: social/next-week
          title: "Social posts for next week (review before merge)"
          commit-message: "social: queue next week's posts"
          body: |
            Generated by `agent/src/social/generate.py`. Check `agent/social/queue/*.json` for captions and
            `site/social/*.png` for the images. Merging deploys the images; `publish.py --really` posts
            them on their scheduled days (only when `social.enabled: true` in agent/config.yml).
          add-paths: |
            agent/social/queue
            site/social
