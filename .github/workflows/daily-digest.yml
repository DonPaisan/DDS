name: Daily digest

# Runs every morning: pulls Meta insights + landing page funnel events, writes the
# digest, emails it (if RESEND_API_KEY/DIGEST_TO are set), and shows what the rules
# engine would have done. Read-only against Meta. Never writes to the ad account.
on:
  schedule:
    - cron: "0 11 * * *"   # 11:00 UTC = 7:00 ET
  workflow_dispatch:

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agent/requirements.txt
      - run: pip install -r agent/requirements.txt

      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: agent/data
          key: dds-data-${{ github.run_id }}
          restore-keys: dds-data-

      - name: Run digest
        working-directory: agent
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          REPORT_TOKEN: ${{ secrets.REPORT_TOKEN }}
          META_TOKEN: ${{ secrets.META_TOKEN }}
          META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          DIGEST_FROM: ${{ secrets.DIGEST_FROM }}
        run: python src/digest.py

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ github.run_id }}
          path: |
            agent/reports/*.md
            agent/logs/*.jsonl
          if-no-files-found: ignore
