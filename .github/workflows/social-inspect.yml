name: Social inspect

# Read-only: pulls the recent Instagram and Facebook posts (captions, types,
# engagement, image URLs) into a downloadable report so content can match the
# existing voice. Run by hand from the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agent/requirements.txt
      - run: pip install -r agent/requirements.txt
      - name: Pull inventory
        working-directory: agent
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
        run: python src/social/inspect.py --limit 40
      - uses: actions/upload-artifact@v4
        with:
          name: social-inventory
          path: agent/reports/social-inventory.*
