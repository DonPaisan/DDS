name: Social metrics

# Every morning: pull engagement for every post from the last 14 days plus the
# account's follower count, then write the review with a trend verdict.
# Read-only against Meta. Commits agent/social/metrics.jsonl, account.jsonl, review.md.
on:
  schedule:
    - cron: "0 12 * * *"   # 12:00 UTC = 8:00 AM ET
  workflow_dispatch:

permissions:
  contents: write

concurrency: social-metrics

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agent/requirements.txt
      - run: pip install -r agent/requirements.txt
      - name: Pull insights
        working-directory: agent
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
        run: python src/social/metrics.py --days 14
      - name: Write review
        working-directory: agent
        run: python src/social/review.py
      - name: Commit
        run: |
          git config user.name "dds-social-bot"
          git config user.email "noreply@debtdirectsolutions.com"
          git pull --rebase origin ${{ github.ref_name }} || true
          git add agent/social/metrics.jsonl agent/social/account.jsonl agent/social/review.md
          git diff --cached --quiet || git commit -m "social: metrics snapshot $(date -u +%F)"
          git push
